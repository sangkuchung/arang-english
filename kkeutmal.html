<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>끝말잇기 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* layout: 상단 모드 선택(컴퓨터와/가족 대결) → 이어 붙일 글자 크게 → 말풍선 기록 → 입력창·힌트·새 게임. 한 화면 게임 */
:root{
  --bg:#f3f8f1; --ink:#26302a; --muted:#64706a; --card:#ffffff; --line:#d9e6d6;
  --me:#3b8ad1; --me-bg:#e6f2fc; --cpu:#e0703d; --cpu-bg:#fff0e6; --p2:#8a5bc7; --p2-bg:#f1eafb;
  --key:#2e9b5f; --key-bg:#e3f6ea; --no:#d4523a; --gold:#e8a317;
  --title:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121713; --ink:#e8efe9; --muted:#a8b4ad; --card:#1c231e; --line:#2f3a32;
  --me:#8cc2f0; --me-bg:#162636; --cpu:#f3a37a; --cpu-bg:#33201a; --p2:#c3a2ef; --p2-bg:#2a2038;
  --key:#6fd39a; --key-bg:#15301f; --no:#f2907b; --gold:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121713; --ink:#e8efe9; --muted:#a8b4ad; --card:#1c231e; --line:#2f3a32;
  --me:#8cc2f0; --me-bg:#162636; --cpu:#f3a37a; --cpu-bg:#33201a; --p2:#c3a2ef; --p2-bg:#2a2038;
  --key:#6fd39a; --key-bg:#15301f; --no:#f2907b; --gold:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
body{overflow-x:hidden}
h1{font-family:var(--title);font-weight:400;font-size:clamp(26px,7vw,32px);margin:0}
.score{font-family:var(--title);font-size:17px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{font:inherit;font-family:var(--title);font-size:17px;padding:10px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.mode[aria-pressed="true"]{border-color:var(--key);background:var(--key-bg);color:var(--key)}
.opts{display:grid;gap:6px}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg span{font-size:14px;color:var(--muted);min-width:44px}
.seg button{font:inherit;font-family:var(--title);font-size:15px;padding:5px 11px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--key);background:var(--key-bg);color:var(--key)}
.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.voice .mic{width:auto;flex:1;font-family:var(--title);font-size:22px}
body.voice form input{display:none}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names input{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.next{background:var(--card);border:3px dashed var(--key);border-radius:18px;padding:12px;text-align:center;display:grid;gap:2px}
.next .who{font-family:var(--title);font-size:18px}
.next .ch{font-family:var(--title);font-size:56px;line-height:1.1;color:var(--key)}
.next .alt{font-size:15px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:8px;max-height:46vh;min-height:140px;overflow-y:auto;padding:4px 2px;scroll-behavior:smooth}
.b{max-width:78%;padding:8px 14px;border-radius:18px;font-family:var(--title);font-size:22px;line-height:1.3}
.b small{display:block;font-family:var(--body);font-size:12.5px;opacity:.8}
.b.me{align-self:flex-end;background:var(--me-bg);color:var(--me);border-bottom-right-radius:6px}
.b.cpu{align-self:flex-start;background:var(--cpu-bg);color:var(--cpu);border-bottom-left-radius:6px}
.b.p2{align-self:flex-start;background:var(--p2-bg);color:var(--p2);border-bottom-left-radius:6px}
.b.sys{align-self:center;background:transparent;color:var(--muted);font-family:var(--body);font-size:15px;text-align:center;max-width:100%}
.b .last{color:var(--key);text-decoration:underline;text-underline-offset:4px}
form{display:flex;gap:8px}
.mic{font:inherit;font-size:24px;width:56px;border-radius:14px;border:3px solid var(--line);background:var(--card);cursor:pointer;flex:none}
.mic.on{border-color:var(--no);background:#fde9e4;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.heard{margin:0;min-height:1.3em;text-align:center;font-family:var(--title);font-size:20px;color:var(--muted)}
form input{flex:1;min-width:0;font:inherit;font-family:var(--title);font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
form input:focus-visible{outline:none;border-color:var(--key)}
.go{font:inherit;font-family:var(--title);font-size:19px;padding:10px 18px;border-radius:14px;border:0;background:var(--key);color:#fff;cursor:pointer}
.msg{margin:0;min-height:1.4em;font-size:16px;text-align:center}
.msg.no{color:var(--no)}.msg.ok{color:var(--key)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-family:var(--title);font-size:16px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.mode:focus-visible,.go:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rules{font-size:14px;color:var(--muted);margin:0;text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <header><h1>끝말잇기 놀이터 🔤</h1><span class="score" id="score"></span></header>

  <div class="modes" role="group" aria-label="게임 방식">
    <button class="mode" data-m="cpu" aria-pressed="true">🤖 컴퓨터와 대결</button>
    <button class="mode" data-m="duo" aria-pressed="false">👨‍👧 둘이서 대결</button>
  </div>
  <div class="opts" role="group" aria-label="난이도와 입력 방식">
    <div class="seg" id="lvl"><span>단계</span><button data-l="0" aria-pressed="true">🎒 초등</button><button data-l="1" aria-pressed="false">📘 중등</button><button data-l="2" aria-pressed="false">📗 고등</button><button data-l="3" aria-pressed="false">🎓 대학</button></div>
    <div class="seg" id="inp"><span>입력</span><button data-i="type" aria-pressed="true">⌨️ 글자로</button><button data-i="voice" aria-pressed="false">🎤 말로</button></div>
  </div>
  <div class="names" id="names" hidden>
    <input id="n1" value="이원이" aria-label="첫 번째 사람 이름" maxlength="6">
    <input id="n2" value="우온이" aria-label="두 번째 사람 이름" maxlength="6">
  </div>

  <section class="next" aria-live="polite">
    <span class="who" id="who"></span>
    <span class="ch" id="ch">?</span>
    <span class="alt" id="alt"></span>
  </section>

  <div class="log" id="log" aria-live="polite"></div>

  <form id="form">
    <input id="w" autocomplete="off" placeholder="단어를 써 보세요" aria-label="단어 입력" maxlength="10">
    <button class="mic" id="mic" type="button" aria-label="말로 하기">🎤</button>
    <button class="go" type="submit">내기!</button>
  </form>
  <p class="heard" id="heard"></p>
  <p class="msg" id="msg" role="status"></p>
  <div class="btns">
    <button class="btn" id="hint" type="button">💡 힌트</button>
    <button class="btn" id="give" type="button">🏳️ 졌다!</button>
    <button class="btn" id="new" type="button">🔄 새 게임</button>
    <button class="btn" id="tts" type="button" aria-pressed="true">🔊 읽어 주기 켬</button>
  </div>
  <p class="rules">🎒초등은 쉬운 단어로 살살, 🎓대학은 "나트륨"처럼 잇기 어려운 단어로 공격해요<br>두 글자 이상 · 한 번 나온 단어는 다시 못 써요 · 두음법칙 OK (리→이, 녀→여, 락→낙)</p>
</div>

const S=0xAC00;const dec=c=>{const k=c.charCodeAt(0)-S;return k<0||k>11171?null:{i:Math.floor(k/588),v:Math.floor(k%588/28),f:k%28};};
const com=(i,v,f)=>String.fromCharCode(S+i*588+v*28+f);
const YV=[2,6,7,12,17,20]; // ㅑㅕㅖㅛㅠㅣ
function starts(ch){ // 이 글자로 끝났을 때 이어 쓸 수 있는 첫 글자들
 const d=dec(ch);if(!d)return[ch];const out=[ch];
 if(d.i===5)out.push(com(YV.includes(d.v)?11:2,d.v,d.f)); // ㄹ → ㅇ/ㄴ
 else if(d.i===2&&YV.includes(d.v))out.push(com(11,d.v,d.f)); // ㄴ → ㅇ
 return out;}

function check(w){
 if(!isHangulWord(w))return'한글로 두 글자 이상 써 주세요.';
 if(used.has(w))return`"${w}"는 벌써 나왔어요!`;
 if(last&&!starts(last.slice(-1)).includes(w[0]))return`"${starts(last.slice(-1)).join('" 또는 "')}"(으)로 시작해야 해요.`;
 return null;}
function play(w,cls,who){used.add(w);last=w;bubble(w,cls,who);}
function cpuMove(){
 const s=starts(last.slice(-1));
 const c=POOL().filter(x=>s.includes(x[0])&&!used.has(x));
 if(!c.length){over=true;score.me++;bubble(`컴퓨터가 "${s[0]}"(으)로 시작하는 단어를 못 찾았어요. 🎉 내가 이겼다!`,'sys');show();return;}
 const cont=w=>{const t=starts(w.slice(-1));return POOL().filter(x=>t.includes(x[0])&&!used.has(x)&&x!==w).length;};

 if(LVL>=2){const sc=c.map(w=>[w,cont(w)]).sort((a,b)=>a[1]-b[1]);const min=sc[0][1];pool=sc.filter(x=>x[1]<=min+(LVL===2?1:0)).map(x=>x[0]);}
 const pick=pool[Math.floor(Math.random()*pool.length)];
 setTimeout(()=>{play(pick,'cpu','컴퓨터');say(pick);turn=0;show();},450);
}

$('hint').onclick=()=>{if(over)return;const s=last?starts(last.slice(-1)):null;
 const c=POOL().filter(x=>(!s||s.includes(x[0]))&&!used.has(x));
 msg(c.length?`💡 이런 단어는 어때요? "${c[Math.floor(Math.random()*c.length)].slice(0,1)}○○…" 첫 글자만 알려 줄게요: ${c.slice(0,3).map(x=>x[0]+'○'.repeat(x.length-1)).join(', ')}`:'힌트로 줄 단어가 없어요. 어려운 글자네요!','ok');};
$('give').onclick=()=>{if(over)return;over=true;const n=names();
 if(MODE==='cpu'){score.cpu++;bubble('컴퓨터가 이겼어요! 다시 도전해 볼까요? 💪','sys');}
 else bubble(`${n[1-turn]} 승리! 🎉 (${used.size}단어까지 이어 갔어요)`,'sys');
 show();};
function reset(){used=new Set();last=null;turn=0;over=false;$('log').innerHTML='';msg('');
 bubble(MODE==='cpu'?'컴퓨터와 끝말잇기! 먼저 단어를 써 보세요.':'둘이서 번갈아 써요. 이어 쓸 단어가 없으면 "졌다!"를 눌러요.','sys');show();$('w').focus();}

// ── 음성: 말로 단어 내기(ko-KR) + 컴퓨터 단어 읽어 주기 ──────────
let TTS=true;
function say(t){if(!TTS||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=0.95;u.onend=()=>{if(VOICE&&!over&&!listening)setTimeout(()=>$('mic').click(),250);};
 const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith('ko'));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
$('tts').onclick=()=>{TTS=!TTS;$('tts').setAttribute('aria-pressed',TTS);$('tts').textContent=TTS?'🔊 읽어 주기 켬':'🔇 읽어 주기 끔';};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false;
if(!SR){$('mic').hidden=true;document.querySelector('#inp [data-i="voice"]').hidden=true;}
$('mic').onclick=()=>{
 if(!SR||over)return;
 if(listening){rec&&rec.stop();return;}
 rec=new SR();rec.lang='ko-KR';rec.interimResults=true;rec.maxAlternatives=5;
 rec.onstart=()=>{listening=true;$('mic').classList.add('on');$('heard').textContent='듣고 있어요… 단어를 말해 보세요';};
 rec.onresult=e=>{const r=e.results[e.results.length-1];
  const alts=[...r].map(a=>a.transcript.replace(/[\s.,!?]/g,''));
  $('heard').textContent='🎧 '+alts[0];
  if(r.isFinal){const good=alts.find(a=>!check(a))||alts[0];$('w').value=good;$('form').requestSubmit();}};
 rec.onerror=e=>{$('heard').textContent=e.error==='not-allowed'?'마이크를 허용해 주세요 (주소창 옆 자물쇠 → 마이크 허용)':'잘 못 들었어요. 다시 눌러 말해 보세요.';};
 rec.onend=()=>{listening=false;$('mic').classList.remove('on');};
 try{rec.start();}catch(e){}
};

document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{LVL=+b.dataset.l;document.querySelectorAll('#lvl button').forEach(x=>x.setAttribute('aria-pressed',x===b));reset();});
document.querySelectorAll('#inp button').forEach(b=>b.onclick=()=>{VOICE=b.dataset.i==='voice';document.querySelectorAll('#inp button').forEach(x=>x.setAttribute('aria-pressed',x===b));
 document.body.classList.toggle('voice',VOICE);$('mic').textContent=VOICE?'🎤 눌러서 말하기':'🎤';if(VOICE&&!SR){$('heard').textContent='이 브라우저는 음성인식이 안 돼요. 크롬이나 삼성 인터넷으로 열어 주세요.';}});
$('new').onclick=reset;
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x===b));$('names').hidden=MODE!=='duo';reset();});
['n1','n2'].forEach(i=>$(i).oninput=show);
reset();
</script>
