<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이원이 우온이 주간 수학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@600&display=swap">
<style>
/* layout: 이번 주 표지(주차·별) → 아이 선택(이원=하늘, 우온=살구) → 문제 카드 10장 세로 나열 → 결과·다른 문제 버튼. 문제는 주차로 정해져 매주 자동으로 바뀐다 */
:root{
  --bg:#fffaf2; --ink:#2d2a26; --muted:#6d665e; --card:#ffffff; --line:#efe3d3;
  --sky:#3b8ad1; --sky-bg:#e6f2fc; --peach:#de6c3a; --peach-bg:#fff0e6;
  --ok:#2e9b5f; --ok-bg:#e4f6eb; --no:#d4523a; --no-bg:#fde9e4; --gold:#e8a317;
  --title:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Fredoka","Jua",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16130f; --ink:#f1ebe3; --muted:#b8afa4; --card:#211d18; --line:#3a332a;
  --sky:#8cc2f0; --sky-bg:#162636; --peach:#f3a37a; --peach-bg:#33201a;
  --ok:#6fd39a; --ok-bg:#15301f; --no:#f2907b; --no-bg:#3a1e18; --gold:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16130f; --ink:#f1ebe3; --muted:#b8afa4; --card:#211d18; --line:#3a332a;
  --sky:#8cc2f0; --sky-bg:#162636; --peach:#f3a37a; --peach-bg:#33201a;
  --ok:#6fd39a; --ok-bg:#15301f; --no:#f2907b; --no-bg:#3a1e18; --gold:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:24px 44px;display:grid;gap:16px}
header{text-align:center;display:grid;gap:4px}
.em{font-size:40px;line-height:1}
h1{font-family:var(--title);font-weight:400;font-size:clamp(26px,6.5vw,34px);margin:0;line-height:1.25}
.wk{margin:0;color:var(--muted);font-size:16px}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kid{font:inherit;font-family:var(--title);font-size:20px;padding:12px 8px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;gap:0;line-height:1.3}
.kid small{font-family:var(--body);font-size:14px;color:var(--muted)}
.kid[aria-pressed="true"].k0{border-color:var(--sky);background:var(--sky-bg);color:var(--sky)}
.kid[aria-pressed="true"].k1{border-color:var(--peach);background:var(--peach-bg);color:var(--peach)}
.kid:focus-visible,.go:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.score{display:flex;justify-content:space-between;align-items:center;font-family:var(--title);font-size:18px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold);transition:width .3s}
.list{display:grid;gap:12px}
.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px}
.q.ok{border-color:var(--ok)}
.q .top{display:flex;gap:10px;align-items:baseline}
.q .n{font-family:var(--num);font-size:16px;color:var(--muted);flex:none}
.q .tag{font-size:13px;color:var(--muted);margin-left:auto;flex:none}
.q .t{margin:0;font-size:19px}
.q .t b{font-family:var(--num);font-weight:600;font-size:22px}
.row{display:flex;gap:8px;align-items:center}
.row input{width:7.5em;min-width:0;font:inherit;font-family:var(--num);font-size:22px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.row input:focus-visible{outline:none;border-color:var(--gold)}
.row .unit{font-size:17px;color:var(--muted)}
.go{font:inherit;font-family:var(--title);font-size:18px;padding:9px 16px;border-radius:12px;border:0;background:var(--gold);color:#2d2a26;cursor:pointer;margin-left:auto}
.fb{margin:0;font-size:16px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.hint{margin:0;font-size:15px;color:var(--muted);background:var(--no-bg);border-radius:10px;padding:6px 10px}
.end{background:var(--card);border:3px solid var(--gold);border-radius:20px;padding:18px;text-align:center;display:grid;gap:6px}
.end .big{font-size:48px;line-height:1}
.end h2{font-family:var(--title);font-weight:400;font-size:26px;margin:0}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-family:var(--title);font-size:17px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.fine{font-size:13px;color:var(--muted);text-align:center;margin:0}
.share{display:grid;gap:8px;margin-top:8px;padding-top:12px;border-top:2px dashed var(--line)}
.sh{font-family:var(--title);font-size:19px;margin:0}
.res{white-space:pre-wrap;text-align:left;font-family:var(--body);font-size:15px;line-height:1.55;background:var(--bg);border-radius:12px;padding:10px 12px;margin:0;user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="em" aria-hidden="true">🧮✏️</div>
    <h1>이원이 우온이<br>이번 주 수학 퀴즈</h1>
    <p class="wk" id="wk"></p>
  </header>

  <div class="kids" role="group" aria-label="누가 풀까요">
    <button class="kid k0" data-k="0" aria-pressed="true">이원이 🌤️<small>초등 3학년 2학기</small></button>
    <button class="kid k1" data-k="1" aria-pressed="false">우온이 🌈<small>초등 2학년 2학기</small></button>
  </div>

  <div class="score"><span id="sc"></span><span id="st"></span></div>
  <div class="bar" aria-hidden="true"><span id="pg"></span></div>

  <section class="list" id="list" aria-live="polite"></section>

  <section class="end" id="end" hidden>
    <div class="big" id="endE"></div>
    <h2 id="endT"></h2>
    <p class="fine" id="endS"></p>
    <div class="share">
      <p class="sh">📮 아빠한테 결과 보내기</p>
      <pre class="res" id="res"></pre>
      <p class="fine" id="autoMsg">아빠에게 결과를 보내는 중이에요...</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="go" id="share" type="button">카톡으로 바로 보내기</button>
        <button class="go" id="copy" type="button">결과 복사하기</button>
      </div>
      <p class="fine" id="copyMsg">급할 때는 '카톡으로 바로 보내기'를 눌러 아빠를 골라 주세요.</p>
    </div>
  </section>

  <div class="btns">
    <button class="btn" id="more">🔄 다른 문제로 한 번 더</button>
    <button class="btn" id="reset">↩ 이번 주 문제로 돌아가기</button>
  </div>
  <p class="fine">문제는 매주 월요일에 새로 바뀌어요. 답은 숫자만 써요.</p>
</div>

<script>
// ── 주차와 난수 ─────────────────────────────────────────
const now=new Date(Date.now()+9*3600e3);                 // 한국 시각
const mon=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()-((now.getUTCDay()+6)%7)));
const weekOfMonth=Math.ceil(mon.getUTCDate()/7);
const WEEK=mon.getUTCFullYear()*10000+(mon.getUTCMonth()+1)*100+mon.getUTCDate();
document.getElementById('wk').textContent=(mon.getUTCMonth()+1)+'월 '+weekOfMonth+'주차 ('+(mon.getUTCMonth()+1)+'/'+mon.getUTCDate()+' 월요일 시작)';
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R;const ri=(a,b)=>a+Math.floor(R()*(b-a+1));const pick=a=>a[Math.floor(R()*a.length)];
const NAMES=[['이원이','이원'],['우온이','우온']];

// ── 문제 만들기: {t:문제(HTML), a:정답, u:단위, tag:단원, h:틀렸을 때 도움말} ──
const G3=[ // 초3 2학기
 ()=>{const a=ri(112,389),b=ri(2,6);return{tag:'곱셈',t:`<b>${a} × ${b}</b> = ?`,a:a*b,h:`${a}를 백·십·일의 자리로 나눠 각각 ${b}를 곱한 뒤 더해요.`};},
 ()=>{const a=ri(12,39),b=ri(11,29);return{tag:'곱셈',t:`<b>${a} × ${b}</b> = ?`,a:a*b,h:`${a} × ${b%10} 와 ${a} × ${b-b%10} 를 따로 구해서 더해요.`};},
 ()=>{const d=ri(3,9),q=ri(12,29);return{tag:'나눗셈',t:`<b>${d*q} ÷ ${d}</b> = ?`,a:q,h:`${d} × □ = ${d*q} 이 되는 수를 찾아요.`};},
 ()=>{const d=ri(3,8),q=ri(4,11),r=ri(1,d-1);return{tag:'나눗셈',t:`<b>${d*q+r} ÷ ${d}</b> 의 <b>나머지</b>는?`,a:r,h:`${d} × ${q} = ${d*q}, ${d*q+r} − ${d*q} 를 계산해요.`};},
 ()=>{const n=pick([['구슬','개','를'],['색종이','장','을'],['사탕','개','를'],['스티커','장','을']]),p=ri(3,8),e=ri(6,12);return{tag:'나눗셈',t:`${n[0]} <b>${p*e}</b>${n[1]}${n[2]} 친구 <b>${p}</b>명에게 똑같이 나눠 주면 한 명이 몇 ${n[1]}씩 받을까요?`,a:e,u:n[1],h:`${p*e} ÷ ${p} 를 계산해요.`};},
 ()=>{const d=pick([2,3,4,5,6]),k=ri(2,8);return{tag:'분수',t:`<b>${d*k}</b>의 <b>1/${d}</b> 은 얼마일까요?`,a:k,h:`${d*k}를 똑같이 ${d}묶음으로 나누면 한 묶음은?`};},
 ()=>{const d=pick([3,4,5,6]),m=ri(2,d-1),k=ri(2,6);return{tag:'분수',t:`<b>${d*k}</b>의 <b>${m}/${d}</b> 은 얼마일까요?`,a:m*k,h:`먼저 1/${d}은 ${k}, 그것이 ${m}개면?`};},
 ()=>{const kg=ri(1,5),g=ri(1,9)*100+pick([0,50]);return{tag:'무게',t:`<b>${kg}kg ${g}g</b> 은 몇 g일까요?`,a:kg*1000+g,u:'g',h:`1kg = 1000g 이에요.`};},
 ()=>{const l=ri(1,4),ml=ri(1,9)*100+pick([0,50]);return{tag:'들이',t:`<b>${l}L ${ml}mL</b> 는 몇 mL일까요?`,a:l*1000+ml,u:'mL',h:`1L = 1000mL 이에요.`};},
 ()=>{const r=ri(3,15);return{tag:'원',t:`반지름이 <b>${r}cm</b>인 원의 <b>지름</b>은 몇 cm일까요?`,a:2*r,u:'cm',h:`지름은 반지름의 2배예요.`};},
 ()=>{const d=ri(4,20)*2;return{tag:'원',t:`지름이 <b>${d}cm</b>인 원의 <b>반지름</b>은 몇 cm일까요?`,a:d/2,u:'cm',h:`반지름은 지름의 절반이에요.`};},
 ()=>{const m=ri(1,4),s=ri(5,55);return{tag:'시간',t:`<b>${m}분 ${s}초</b> 는 몇 초일까요?`,a:m*60+s,u:'초',h:`1분 = 60초 예요.`};},
 ()=>{const box=ri(4,9),each=ri(12,25),n=pick(['연필이','지우개가','쿠키가']);return{tag:'곱셈',t:`한 상자에 ${n} <b>${each}</b>개씩 들어 있어요. <b>${box}</b>상자에는 모두 몇 개일까요?`,a:box*each,u:'개',h:`${each} × ${box} 를 계산해요.`};},
];
const G2=[ // 초2 2학기
 ()=>{const a=ri(2,9),b=ri(2,9);return{tag:'곱셈구구',t:`<b>${a} × ${b}</b> = ?`,a:a*b,h:`${a}단을 차례로 외워 봐요: ${a}, ${a*2}, ${a*3} …`};},
 ()=>{const a=ri(3,9),b=ri(3,9);return{tag:'곱셈구구',t:`<b>${a} × □ = ${a*b}</b> 에서 □는?`,a:b,h:`${a}단에서 ${a*b}가 나오는 곳을 찾아요.`};},
 ()=>{const n=pick([['개구리','다리',4,'마리'],['자동차','바퀴',4,'대'],['오리','다리',2,'마리'],['문어','다리',8,'마리'],['세발자전거','바퀴',3,'대']]),k=ri(3,9);return{tag:'곱셈구구',t:`${n[0]} <b>${k}</b>${n[3]}의 ${n[1]}는 모두 몇 개일까요?`,a:n[2]*k,u:'개',h:`${n[0]} 하나에 ${n[1]} ${n[2]}개 → ${n[2]} × ${k}`};},
 ()=>{const d=[ri(1,9),ri(0,9),ri(0,9),ri(0,9)],num=+d.join(''),i=ri(0,3),pv=[1000,100,10,1][i];const dd=d[i]||1;d[i]=dd;const n2=+d.join('');return{tag:'네 자리 수',t:`<b>${n2}</b> 에서 <b>${['천','백','십','일'][i]}의 자리</b> 숫자 ${dd}${[0,1,3,6,7,8].includes(dd)?'은':'는'} 얼마를 나타낼까요?`,a:dd*pv,h:`${['천','백','십','일'][i]}의 자리니까 ${dd} × ${pv}`};},
 ()=>{const a=ri(25,68),b=ri(15,39);return{tag:'덧셈',t:`<b>${a} + ${b}</b> = ?`,a:a+b,h:`일의 자리끼리 더해서 10이 넘으면 십의 자리로 1을 올려요.`};},
 ()=>{const a=ri(51,95),b=ri(16,a-10);return{tag:'뺄셈',t:`<b>${a} − ${b}</b> = ?`,a:a-b,h:`일의 자리에서 뺄 수 없으면 십의 자리에서 10을 빌려 와요.`};},
 ()=>{const m=ri(1,3),c=ri(5,95);return{tag:'길이',t:`<b>${m}m ${c}cm</b> 는 몇 cm일까요?`,a:m*100+c,u:'cm',h:`1m = 100cm 예요.`};},
 ()=>{const h=ri(1,2),m=ri(5,55);return{tag:'시간',t:`<b>${h}시간 ${m}분</b> 은 몇 분일까요?`,a:h*60+m,u:'분',h:`1시간 = 60분 이에요.`};},
 ()=>{const s=ri(1,9),d=ri(2,6),k=ri(3,4);const seq=[0,1,2,3].map(i=>s+d*i);return{tag:'규칙 찾기',t:`규칙을 찾아 보세요: <b>${seq.join(', ')}, □</b>`,a:s+d*4,h:`앞의 수와 다음 수가 얼마씩 커지는지 봐요 (+${d}).`};},
 ()=>{const p=ri(3,8),e=ri(3,9),n=pick(['사탕','딸기','구슬']);return{tag:'곱셈구구',t:`${NAMES[1][0]}가 ${n}을 한 봉지에 <b>${e}</b>개씩 <b>${p}</b>봉지 샀어요. 모두 몇 개일까요?`,a:p*e,u:'개',h:`${e} × ${p} 를 계산해요.`};},
 ()=>{const a=ri(120,480),b=ri(110,390);return{tag:'덧셈',t:`줄넘기를 어제 <b>${a}</b>번, 오늘 <b>${b}</b>번 했어요. 모두 몇 번일까요?`,a:a+b,u:'번',h:`${a} + ${b} 를 자리별로 더해요.`};},
];
function build(k,variant){
 R=rng(WEEK*10+k*7+variant*1000);
 const pool=k===0?G3:G2,qs=[];
 const order=pool.map((f,i)=>i).sort(()=>R()-0.5);
 while(qs.length<10){qs.push(pool[order[qs.length%order.length]]());}
 return qs;
}

// ── 화면 ────────────────────────────────────────────────
let K=0,V=0,QS=[],state=[],T0=Date.now();
const $=x=>document.getElementById(x);
function render(){
 QS=build(K,V);state=QS.map(()=>({ok:false,tries:0,wrong:[]}));T0=Date.now();
 document.querySelectorAll('.kid').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===K));
 $('list').innerHTML=QS.map((q,i)=>`<article class="q" id="q${i}"><div class="top"><span class="n">Q${i+1}</span><p class="t">${q.t}</p><span class="tag">${q.tag}</span></div>
  <form class="row" data-i="${i}"><input inputmode="numeric" pattern="[0-9]*" aria-label="${i+1}번 답" autocomplete="off"><span class="unit">${q.u||''}</span><button class="go" type="submit">확인</button></form>
  <p class="fb" id="fb${i}"></p><p class="hint" id="h${i}" hidden></p></article>`).join('');
 $('list').querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();check(+f.dataset.i,f.querySelector('input'));});
 $('end').hidden=true;upd();
}
function check(i,inp){
 const s=state[i],q=QS[i],v=inp.value.replace(/[^0-9]/g,''),fb=$('fb'+i);
 if(s.ok)return;
 if(v===''){fb.textContent='숫자로 답을 써 주세요.';fb.className='fb no';return;}
 if(+v===q.a){s.ok=true;fb.textContent=s.tries?'맞았어요! 👍':'정답! ⭐';fb.className='fb ok';$('q'+i).classList.add('ok');inp.disabled=true;$('h'+i).hidden=true;
  const nx=$('list').querySelector('.q:not(.ok) input');if(nx)nx.focus({preventScroll:false});}
 else{s.tries++;s.wrong.push(v);fb.textContent=s.tries>=2?`아쉬워요. 정답은 ${q.a}${q.u||''}예요.`:'다시 한 번 생각해 볼까요?';fb.className='fb no';$('h'+i).textContent='💡 '+q.h;$('h'+i).hidden=false;
  if(s.tries>=2){s.ok=true;inp.disabled=true;}}
 upd();
}
function summary(star){
 const min=Math.max(1,Math.round((Date.now()-T0)/60000));
 const miss=QS.map((q,i)=>({q,s:state[i],i})).filter(x=>x.s.tries>0);
 const plain=h=>h.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
 let t=`[${NAMES[K][0]} 수학 퀴즈 결과] ${document.getElementById('wk').textContent.split(' (')[0]}${V?' · 추가 문제 '+V:''}
⭐ ${star} / 10 (한 번에 맞힘) · 걸린 시간 약 ${min}분`;
 if(!miss.length)t+='\n🏆 모든 문제를 한 번에 맞혔어요!';
 else{t+='\n다시 볼 문제:';miss.forEach(x=>{t+=`
· Q${x.i+1} ${plain(x.q.t)} → 정답 ${x.q.a}${x.q.u||''} (쓴 답 ${x.s.wrong.join(', ')})`;});}
 return t;
}
// ── 아빠에게 자동 전송 (ntfy 중계 → 아빠 PC의 Claude가 카톡으로 전달) ──
const INBOX='https://ntfy.sh/kidsmath-5475281002566e816a07';
let sentKey='';
function compact(star){
 const min=Math.max(1,Math.round((Date.now()-T0)/60000));
 const miss=QS.map((q,i)=>({q,s:state[i],i})).filter(x=>x.s.tries>0);
 let t=`[${NAMES[K][0]} 수학] ${document.getElementById('wk').textContent.split(' (')[0]}${V?' 추가'+V:''} ⭐${star}/10 · ${min}분`;
 t+= miss.length ? '\n다시 볼 문제: '+miss.map(x=>`Q${x.i+1} ${x.q.tag} 정답 ${x.q.a}${x.q.u||''}(쓴 답 ${x.s.wrong.join('·')})`).join(', ') : '\n🏆 전부 한 번에 맞힘!';
 return t;
}
function autoSend(star){
 const key=K+'-'+V+'-'+T0; if(sentKey===key)return; sentKey=key;
 const m=$('autoMsg');
 fetch(INBOX,{method:'POST',body:compact(star),keepalive:true})
  .then(r=>{m.textContent=r.ok?'✅ 아빠 카톡으로 결과가 자동으로 가고 있어요. (조금 늦게 도착할 수 있어요)':'자동 전송이 안 됐어요. 아래 버튼으로 보내 주세요.';})
  .catch(()=>{m.textContent='인터넷이 불안정해서 자동 전송이 안 됐어요. 아래 버튼으로 보내 주세요.';});
}
function upd(){
 const done=state.filter(s=>s.ok).length,star=state.filter((s,i)=>s.ok&&s.tries===0).length;
 $('sc').textContent=NAMES[K][0]+' · '+done+' / 10 문제';$('st').textContent='⭐ '+star;
 $('pg').style.width=done*10+'%';
 if(done===10){$('end').hidden=false;$('endE').textContent=star>=9?'🏆':star>=7?'🎉':'💪';
  $('endT').textContent=`⭐ ${star}개! ${star>=9?'수학 박사!':star>=7?'아주 잘했어요!':'끝까지 풀었어요, 멋져요!'}`;
  $('endS').textContent='틀린 문제는 도움말을 다시 읽어 보세요. 다른 문제로 한 번 더 풀 수도 있어요.';
  $('res').textContent=summary(star);
  autoSend(star);
  $('end').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});}
}
$('share').onclick=()=>{const t=$('res').textContent;
 if(navigator.share){navigator.share({text:t}).catch(()=>{});} else {$('copy').click();}};
$('copy').onclick=()=>{const t=$('res').textContent,m=$('copyMsg');
 const ok=()=>{m.textContent='복사했어요! 가족 카톡방에 붙여넣기 해 주세요.';},fb=()=>{const r=document.createRange();r.selectNodeContents($('res'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);m.textContent='위 글자를 길게 눌러 복사해 주세요.';};
 try{navigator.clipboard.writeText(t).then(ok,fb);}catch(e){fb();}};
document.querySelectorAll('.kid').forEach(b=>b.onclick=()=>{K=+b.dataset.k;V=0;render();});
$('more').onclick=()=>{V++;render();window.scrollTo({top:0});};
$('reset').onclick=()=>{V=0;render();window.scrollTo({top:0});};
render();
</script>
